spring.application.name=ProyectoFinal

server.port=${PORT:96}

logging.pattern.dateformat=hh:mm
spring.main.banner-mode=off
spring.thymeleaf.cache=false

# Conexión local o conexión de Render con Aiven
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/proyecto_final}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:28051977}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.type.descriptor.sql.BasicBinder=TRACE

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

firebase.bucket.name=fitsystem-c876c.firebasestorage.app
firebase.storage.path=fitsystem
firebase.json.path=firebase
