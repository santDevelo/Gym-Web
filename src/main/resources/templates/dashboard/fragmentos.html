<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <!-- Barra lateral compartida -->
    <aside th:fragment="sidebar"
           class="sidebar d-flex flex-column
                  justify-content-between">

        <div>

            <!-- Logo -->
            <a th:href="@{/dashboard}"
               class="text-decoration-none">

                <h2 class="logo">
                    FIT <span>SYSTEM</span>
                </h2>

                <small class="text-secondary">
                    Tu gimnasio, tu mejor versión
                </small>

            </a>

            <!-- Navegación -->
            <nav class="nav flex-column mt-4"
                 aria-label="Menú principal">

                <a th:href="@{/dashboard}"
                   class="nav-link"
                   th:classappend="${seccionActiva == null
                                    or seccionActiva == 'dashboard'}
                                    ? ' active'
                                    : ''">

                    <i class="fa-solid fa-house me-2"></i>
                    Dashboard

                </a>

                <!-- Opciones del administrador -->
                <div sec:authorize="hasRole('ADMINISTRADOR')">

                    <a th:href="@{/usuario/listado}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'usuarios'}
                                       ? ' active'
                                       : ''">

                        <i class="fa-solid fa-users me-2"></i>
                        Usuarios

                    </a>

                    <a th:href="@{/usuario/listado(rol='CLIENTE')}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'clientes'}
                                       ? ' active'
                                       : ''">

                        <i class="fa-solid fa-user-group me-2"></i>
                        Clientes

                    </a>

                    <a th:href="@{/usuario/listado(rol='ENTRENADOR')}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'empleados'}
                                       ? ' active'
                                       : ''">

                        <i class="fa-solid fa-user-tie me-2"></i>
                        Empleados

                    </a>

                    <span class="nav-link">

                        <i class="fa-solid fa-credit-card me-2"></i>
                        Membresías

                    </span>

                    <span class="nav-link">

                        <i class="fa-solid fa-money-bill me-2"></i>
                        Pagos

                    </span>

                    <span class="nav-link">

                        <i class="fa-solid fa-chart-column me-2"></i>
                        Reportes

                    </span>

                </div>

                <!-- Opciones del entrenador -->
                <div sec:authorize="hasRole('ENTRENADOR')">

                    <span class="nav-link">

                        <i class="fa-solid fa-users me-2"></i>
                        Clientes

                    </span>

                    <span class="nav-link">

                        <i class="fa-solid fa-dumbbell me-2"></i>
                        Rutinas

                    </span>

                    <span class="nav-link">

                        <i class="fa-solid fa-calendar me-2"></i>
                        Citas

                    </span>

                </div>

                <!-- Opciones del cliente -->
                <div sec:authorize="hasRole('CLIENTE')">

                    <span class="nav-link">

                        <i class="fa-solid fa-credit-card me-2"></i>
                        Mi membresía

                    </span>

                    <span class="nav-link">

                        <i class="fa-solid fa-dumbbell me-2"></i>
                        Mi rutina

                    </span>

                    <span class="nav-link">

                        <i class="fa-solid fa-calendar-plus me-2"></i>
                        Reservar cita

                    </span>

                    <span class="nav-link">

                        <i class="fa-solid fa-clipboard-check me-2"></i>
                        Mi asistencia

                    </span>

                </div>

            </nav>

        </div>

        <!-- Cierre de sesión -->
        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="nav-link border-0
                           bg-transparent w-100 text-start">

                <i class="fa-solid
                          fa-right-from-bracket me-2"></i>

                Cerrar sesión

            </button>

        </form>

    </aside>


    <!-- Encabezado compartido -->
    <header th:fragment="header"
            class="header-cliente">

        <div>

            <h4 class="mb-0">

                ¡Hola,

                <span class="text-purple"
                      th:text="${usuario != null
                               ? usuario.nombre
                               : #authentication.name}">
                    Usuario
                </span>!

            </h4>

            <small class="text-muted">
                Bienvenido de nuevo a FitSystem
            </small>

        </div>

        <div class="d-flex align-items-center gap-2">

            <!-- Imagen registrada -->
            <img th:if="${usuario != null
                         and usuario.rutaImagen != null
                         and !#strings.isEmpty(usuario.rutaImagen)}"
                 th:src="${usuario.rutaImagen}"
                 alt="Imagen del usuario"
                 class="rounded-circle"
                 style="width: 42px;
                        height: 42px;
                        object-fit: cover;">

            <!-- Imagen predeterminada -->
            <i th:unless="${usuario != null
                           and usuario.rutaImagen != null
                           and !#strings.isEmpty(usuario.rutaImagen)}"
               class="fa-solid fa-circle-user
                      fs-3 text-purple">
            </i>

            <div>

                <strong th:if="${usuario != null}"
                        th:text="|${usuario.nombre}
                                  ${usuario.apellidos}|">
                    Nombre del usuario
                </strong>

                <strong th:unless="${usuario != null}"
                        sec:authentication="name">
                    Usuario
                </strong>

                <small class="d-block text-muted"
                       sec:authorize="hasRole('ADMINISTRADOR')">
                    Administrador
                </small>

                <small class="d-block text-muted"
                       sec:authorize="hasRole('ENTRENADOR')">
                    Entrenador
                </small>

                <small class="d-block text-muted"
                       sec:authorize="hasRole('CLIENTE')">
                    Cliente
                </small>

            </div>

        </div>

    </header>

</body>
</html>
