<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<body>

    <!-- =====================================================
         BARRA LATERAL COMPARTIDA
         ===================================================== -->

    <aside th:fragment="sidebar"
           class="sidebar d-flex flex-column justify-content-between">

        <div>

            <!-- Logo -->
            <a th:href="@{/dashboard}"
               class="text-decoration-none">

                <h2 class="logo">
                    FIT <span>SYSTEM</span>
                </h2>

                <small class="text-secondary" th:text="#{app.descripcion}">
                    Tu gimnasio, tu mejor versión
                </small>

            </a>

            <!-- Navegación -->
            <nav class="nav flex-column mt-4"
           th:aria-label="#{nav.menuPrincipal}">

                <!-- Dashboard -->
                <a th:href="@{/dashboard}"
                   class="nav-link"
                   th:classappend="${seccionActiva == null
                                    or seccionActiva == 'dashboard'}
                                    ? ' active'
                                    : ''">

                    <i class="fa-solid fa-house me-2"></i>
                    <span th:text="#{nav.dashboard}">Dashboard</span>

                </a>

                <!-- =========================================
                     OPCIONES DEL ADMINISTRADOR
                     ========================================= -->

                <div sec:authorize="hasRole('ADMINISTRADOR')">

                    <!-- Enlace funcional -->
                    <a th:href="@{/usuario/listado}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'usuarios'}
                                       ? ' active'
                                       : ''">

                        <i class="fa-solid fa-users me-2"></i>
                        <span th:text="#{nav.usuarios}">Usuarios</span>

                    </a>

                    <a th:href="@{/usuario/listado(rol='CLIENTE')}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'clientes'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-user-group me-2"></i>
                        <span th:text="#{nav.clientes}">Clientes</span>
                    </a>

                    <a th:href="@{/usuario/listado(rol='ENTRENADOR')}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'empleados'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-user-tie me-2"></i>
                        <span th:text="#{nav.empleados}">Empleados</span>
                    </a>

                    <a th:href="@{/admin/membresias}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'membresias'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-credit-card me-2"></i>
                        <span th:text="#{nav.membresias}">Membresías</span>
                    </a>

                    <a th:href="@{/admin/pagos}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'pagos'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-money-bill me-2"></i>
                        <span th:text="#{nav.pagos}">Pagos</span>
                    </a>

                </div>

                <!-- =========================================
                     OPCIONES DEL ENTRENADOR
                     ========================================= -->

                <div sec:authorize="hasRole('ENTRENADOR')">

                    <a th:href="@{/entrenador/clientes}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'entrenador-clientes'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-users me-2"></i>
                        <span th:text="#{nav.clientes}">Clientes</span>
                    </a>

                    <a th:href="@{/entrenador/rutinas}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'entrenador-rutinas'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-dumbbell me-2"></i>
                        <span th:text="#{nav.rutinas}">Rutinas</span>
                    </a>

                    <a th:href="@{/entrenador/progreso}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'entrenador-progreso'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-chart-line me-2"></i>
                        <span th:text="#{nav.progreso}">Progreso</span>
                    </a>

                </div>

                <!-- =========================================
                     OPCIONES DEL CLIENTE
                     ========================================= -->

                <div sec:authorize="hasRole('CLIENTE')">

                    <!-- Vista funcional: membresía del cliente -->
                    <a th:href="@{/cliente/membresia}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'cliente-membresia'}
                       ? ' active'
                       : ''">

                        <i class="fa-solid fa-credit-card me-2"></i>
                        <span th:text="#{nav.miMembresia}">Mi membresía</span>

                    </a>

                    <a th:href="@{/cliente/rutina}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'cliente-rutina'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-dumbbell me-2"></i>
                        <span th:text="#{nav.miRutina}">Mi rutina</span>
                    </a>

                    <a th:href="@{/cliente/asistencia}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'cliente-asistencia'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-clipboard-check me-2"></i>
                        <span th:text="#{nav.miAsistencia}">Mi asistencia</span>
                    </a>

                    <a th:href="@{/cliente/perfil}"
                       class="nav-link"
                       th:classappend="${seccionActiva == 'cliente-perfil'}
                                       ? ' active'
                                       : ''">
                        <i class="fa-solid fa-user me-2"></i>
                        <span th:text="#{nav.miPerfil}">Mi perfil</span>
                    </a>

                </div>

            </nav>

        </div>

        <!-- Cierre de sesión -->
        <form th:action="@{/logout}"
              method="post">

            <button type="submit"
                    class="nav-link border-0
                           bg-transparent w-100 text-start">

                <i class="fa-solid fa-right-from-bracket me-2"></i>
                <span th:text="#{nav.cerrarSesion}">Cerrar sesión</span>

            </button>

        </form>

    </aside>


    <!-- =====================================================
         ENCABEZADO COMPARTIDO
         ===================================================== -->

    <header th:fragment="header"
            class="header-cliente">

        <div>

            <h4 class="mb-0">

                <span th:text="#{encabezado.hola}">¡Hola,</span>

                <span class="text-purple"
                      th:text="${usuario != null
                               ? usuario.nombre
                               : #authentication.name}">
                    Usuario
                </span>!

            </h4>

            <small class="text-muted" th:text="#{encabezado.bienvenida}">
                Bienvenido de nuevo a FitSystem
            </small>

        </div>

        <div class="d-flex align-items-center gap-2">

            <div th:replace="~{general/fragmentos :: idiomas}"></div>

            <!-- Imagen registrada -->
            <img th:if="${usuario != null
                         and usuario.rutaImagen != null
                         and !#strings.isEmpty(usuario.rutaImagen)}"
                 th:src="${usuario.rutaImagen}"
                     th:alt="#{usuario.imagen}"
                 class="rounded-circle"
                 style="width: 42px;
                        height: 42px;
                        object-fit: cover;">

            <!-- Imagen predeterminada -->
            <i th:unless="${usuario != null
                           and usuario.rutaImagen != null
                           and !#strings.isEmpty(usuario.rutaImagen)}"
               class="fa-solid fa-circle-user
                      fs-3 text-purple">
            </i>

            <div>

                <!-- Nombre completo -->
                <strong th:if="${usuario != null}"
                        th:text="|${usuario.nombre}
                                  ${usuario.apellidos}|">
                    Nombre del usuario
                </strong>

                <!-- Nombre de autenticación alternativo -->
                <strong th:unless="${usuario != null}"
                        sec:authentication="name">
                    Usuario
                </strong>

                <!-- Rol actual -->
                <small class="d-block text-muted"
                       sec:authorize="hasRole('ADMINISTRADOR')" th:text="#{rol.administrador}">
                    Administrador
                </small>

                <small class="d-block text-muted"
                       sec:authorize="hasRole('ENTRENADOR')" th:text="#{rol.entrenador}">
                    Entrenador
                </small>

                <small class="d-block text-muted"
                       sec:authorize="hasRole('CLIENTE')" th:text="#{rol.cliente}">
                    Cliente
                </small>

            </div>

        </div>

    </header>

</body>
</html>
