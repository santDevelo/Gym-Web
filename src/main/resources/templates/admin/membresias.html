<!DOCTYPE html>
<html th:lang="${#locale.language}"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}">
    <title>Membresías - FitSystem</title>
</head>

<body>

    <aside th:replace="~{dashboard/fragmentos :: sidebar}">
    </aside>

    <header th:replace="~{dashboard/fragmentos :: header}">
    </header>

    <main class="contenido-cliente">

        <section th:replace="~{admin/fragmentos :: mensajes}">
        </section>

        <div class="container-fluid py-4">

            <div class="mb-4">
                <h3 class="mb-1" th:text="#{membresia.titulo}">Membresías</h3>
                <p class="text-muted mb-0" th:text="#{membresia.descripcionPlanes}">
                    Consulta y modifica los planes disponibles en FitSystem.
                </p>
            </div>

            <div class="row g-4"
                 th:if="${planes != null and !planes.empty}">

                <div class="col-12 col-md-6 col-xl-4"
                     th:each="plan : ${planes}">

                    <div class="card card-dashboard h-100"
                         th:classappend="${plan.nombre == 'Plan Completo'}
                                         ? ' bg-dark text-white'
                                         : ''">

                        <div class="card-body d-flex flex-column p-4">

                            <div class="d-flex justify-content-between
                                        align-items-start gap-3 mb-3">

                                <h4 class="fw-bold mb-0"
                                    th:text="${plan.nombre}">
                                    Nombre del plan
                                </h4>

                                <span class="badge"
                                      th:classappend="${plan.activo}
                                                      ? ' bg-success'
                                                      : ' bg-secondary'"
                                      th:text="${plan.activo
                                                ? #messages.msg('comun.activo')
                                                : #messages.msg('comun.inactivo')}">
                                    Estado
                                </span>

                            </div>

                            <p th:if="${plan.descripcion != null
                                      and !#strings.isEmpty(plan.descripcion)}"
                               th:class="${plan.nombre == 'Plan Completo'}
                                         ? 'text-white-50'
                                         : 'text-muted'"
                               th:text="${plan.descripcion}">
                                Descripción del plan
                            </p>

                            <p class="fs-4 fw-bold mt-auto mb-4"
                               th:text="|₡${#numbers.formatDecimal(
                                        plan.precio,
                                        1,
                                        'COMMA',
                                        0,
                                        'POINT')} ${#messages.msg('membresia.porMesIva')}|">
                                ₡0 / mes + IVA
                            </p>

                            <button type="button"
                                    class="btn btn-purple w-100"
                                    data-bs-toggle="modal"
                                    th:data-bs-target="|#editarPlan${plan.idPlan}|">

                                <i class="fa-solid fa-pen-to-square me-2"></i>
                                <span th:text="#{accion.editar}">Editar</span>

                            </button>

                        </div>

                    </div>

                    <div class="modal fade"
                         th:id="|editarPlan${plan.idPlan}|"
                         tabindex="-1"
                         aria-hidden="true">

                        <div class="modal-dialog modal-dialog-centered">

                            <div class="modal-content text-dark">

                                <div class="modal-header">

                                    <h5 class="modal-title" th:text="#{membresia.editarMembresia}">
                                        Editar membresía
                                    </h5>

                                    <button type="button"
                                            class="btn-close"
                                            data-bs-dismiss="modal"
                                            th:aria-label="#{accion.cerrar}">
                                    </button>

                                </div>

                                <form th:action="@{/admin/membresias/guardar}"
                                      method="post">

                                    <input type="hidden"
                                           name="idPlan"
                                           th:value="${plan.idPlan}">

                                    <div class="modal-body">

                                        <div class="mb-3">

                                            <label th:for="|nombrePlan${plan.idPlan}|"
                                                   class="form-label"
                                                   th:text="#{comun.nombre}">
                                                Nombre
                                            </label>

                                            <input type="text"
                                                   th:id="|nombrePlan${plan.idPlan}|"
                                                   name="nombre"
                                                   class="form-control"
                                                   th:value="${plan.nombre}"
                                                   maxlength="50"
                                                   required>

                                        </div>

                                        <div class="mb-3">

                                            <label th:for="|descripcionPlan${plan.idPlan}|"
                                                   class="form-label"
                                                   th:text="#{comun.descripcion}">
                                                Descripción
                                            </label>

                                            <textarea th:id="|descripcionPlan${plan.idPlan}|"
                                                      name="descripcion"
                                                      class="form-control"
                                                      rows="4"
                                                      maxlength="1000"
                                                      th:text="${plan.descripcion}">
                                            </textarea>

                                        </div>

                                        <div class="mb-3">

                                            <label th:for="|precioPlan${plan.idPlan}|"
                                                   class="form-label"
                                                   th:text="#{membresia.precioMensual}">
                                                Precio mensual
                                            </label>

                                            <div class="input-group">

                                                <span class="input-group-text">₡</span>

                                                <input type="number"
                                                       th:id="|precioPlan${plan.idPlan}|"
                                                       name="precio"
                                                       class="form-control"
                                                       th:value="${plan.precio}"
                                                       min="0.01"
                                                       step="0.01"
                                                       required>

                                            </div>

                                        </div>

                                        <div class="form-check">

                                            <input type="checkbox"
                                                   th:id="|activoPlan${plan.idPlan}|"
                                                   name="activo"
                                                   value="true"
                                                   class="form-check-input"
                                                   th:checked="${plan.activo}">

                                            <label th:for="|activoPlan${plan.idPlan}|"
                                                   class="form-check-label"
                                                   th:text="#{membresia.planActivo}">
                                                Plan activo
                                            </label>

                                        </div>

                                    </div>

                                    <div class="modal-footer">

                                        <button type="button"
                                                class="btn btn-secondary"
                                                data-bs-dismiss="modal"
                                                th:text="#{accion.cancelar}">
                                            Cancelar
                                        </button>

                                        <button type="submit"
                                                class="btn btn-purple">

                                            <i class="fa-solid
                                                      fa-floppy-disk me-2"></i>

                                            <span th:text="#{accion.guardarCambios}">Guardar cambios</span>

                                        </button>

                                    </div>

                                </form>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

            <div th:if="${planes == null or planes.empty}"
                 class="alert alert-info"
                 th:text="#{membresia.sinPlanes}">
                No hay planes registrados todavía.
            </div>

        </div>

    </main>

</body>
</html>
