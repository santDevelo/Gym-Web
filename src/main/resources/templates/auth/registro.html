<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}">
    <title>Registro - FitSystem</title>
</head>

<body class="login-bg">

<div class="position-fixed top-0 end-0 m-3">
    <div th:replace="~{general/fragmentos :: idiomas}"></div>
</div>

<div class="container d-flex justify-content-center align-items-center min-vh-100">

    <div class="login-card">

        <div class="text-center mb-4">

            <i class="fa-solid fa-user-plus fa-3x text-purple mb-3"></i>

            <h2 class="fw-bold text-purple" th:text="#{auth.crearCuenta}">
                Crear una cuenta
            </h2>

            <p class="text-muted" th:text="#{auth.completarInformacion}">
                Completa la siguiente información
            </p>

        </div>

        <form th:action="@{/registro}" method="post">

            <div class="mb-3">

                <label class="form-label" th:text="#{auth.nombre}">
                    Nombre
                </label>

                <input
                    type="text"
                    name="nombre"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label" th:text="#{auth.apellidos}">
                    Apellidos
                </label>

                <input
                    type="text"
                    name="apellidos"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label" th:text="#{auth.correo}">
                    Correo electrónico
                </label>

                <input
                    type="email"
                    name="correo"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label" th:text="#{auth.telefono}">
                    Teléfono
                </label>

                <input
                    type="text"
                    name="telefono"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label" th:text="#{auth.usuario}">
                    Usuario
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    required>

            </div>

            <div class="mb-3">

                <label class="form-label" th:text="#{auth.contrasena}">
                    Contraseña
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    required>

            </div>

            <button type="submit" class="btn btn-purple w-100" th:text="#{auth.crearCuenta}">

                Crear cuenta

            </button>

        </form>

        <hr>

        <div class="text-center">

            <a th:href="@{/login}" class="text-decoration-none" th:text="#{auth.yaTengoCuenta}">
                Ya tengo una cuenta
            </a>

        </div>

        <div class="text-center mt-2">

            <a th:href="@{/acceso}" class="text-decoration-none" th:text="#{accion.volver}">
                Volver
            </a>

        </div>

    </div>

</div>

</body>

</html>
