<!DOCTYPE html>
<html th:lang="${#locale.language}" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}">
    <title>Acceso - FitSystem</title>
</head>

<body class="login-bg">

    <div class="position-fixed top-0 end-0 m-3">
        <div th:replace="~{general/fragmentos :: idiomas}"></div>
    </div>

    <div class="container d-flex justify-content-center align-items-center min-vh-100">

        <div class="login-card">

            <div class="text-center mb-4">

                <i class="fas fa-dumbbell login-icon"></i>

                <h2 class="fw-bold text-purple">
                    FitSystem
                </h2>

                <p class="text-muted" th:text="#{auth.accesoPregunta}">
                    ¿Qué deseas hacer?
                </p>

            </div>

            <div class="d-grid gap-3">

                <a th:href="@{/login}" class="btn btn-purple" th:text="#{auth.iniciarSesion}">

                    Iniciar sesión

                </a>

                <a th:href="@{/registro}" class="btn btn-outline-secondary"
                   th:text="#{auth.crearCuenta}">

                    Crear una cuenta

                </a>

            </div>

            <hr class="my-4">

            <div class="text-center">

                <a th:href="@{/}" class="text-decoration-none" th:text="#{auth.volverInicio}">

                    ← Volver al inicio

                </a>

            </div>

        </div>

    </div>

</body>

</html>
