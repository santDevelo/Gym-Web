<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{general/fragmentos :: head}">
    <title>Iniciar sesión - FitSystem</title>
</head>

<body class="login-bg">

<div class="container vh-100
            d-flex justify-content-center
            align-items-center">

    <div class="login-card">

        <div class="text-center mb-4">

            <i class="fa-solid fa-dumbbell
                      fa-3x text-purple mb-3">
            </i>

            <h1 class="fw-bold text-purple">
                FitSystem
            </h1>

            <p class="text-muted mb-0">
                Inicia sesión en tu cuenta
            </p>

        </div>

        <form th:action="@{/login}"
              method="post">

            <div class="mb-3">

                <label for="username"
                       class="form-label">
                    Usuario
                </label>

                <input type="text"
                       id="username"
                       name="username"
                       class="form-control"
                       autocomplete="username"
                       required
                       autofocus>

            </div>

            <div class="mb-4">

                <label for="password"
                       class="form-label">
                    Contraseña
                </label>

                <input type="password"
                       id="password"
                       name="password"
                       class="form-control"
                       autocomplete="current-password"
                       required>

            </div>

            <div th:if="${param.error}"
                 class="alert alert-danger text-center"
                 role="alert">

                Usuario o contraseña incorrectos.

            </div>

            <div th:if="${param.logout}"
                 class="alert alert-success text-center"
                 role="alert">

                La sesión se cerró correctamente.

            </div>

            <div th:if="${mensaje}"
                 class="alert alert-success text-center"
                 role="alert">

                <span th:text="${mensaje}">
                    Cuenta creada correctamente.
                </span>

            </div>

            <button type="submit"
                    class="btn btn-purple w-100">

                <i class="fa-solid fa-right-to-bracket me-2">
                </i>

                Iniciar sesión

            </button>

        </form>

        <hr>

        <div class="text-center">

            <p class="mb-2">
                ¿No tienes una cuenta?
            </p>

            <a th:href="@{/registro}"
               class="text-decoration-none
                      fw-bold text-purple">

                Regístrate aquí

            </a>

        </div>

        <div class="text-center mt-3">

            <a th:href="@{/}"
               class="text-decoration-none">

                ← Volver al inicio

            </a>

        </div>

    </div>

</div>

</body>
</html>
